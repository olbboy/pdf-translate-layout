# Engine policy defaults — snapshot vào job.yaml lúc tạo job (spec §14).
languages:
  source: en
  target: vi

unicode:
  normalization: NFC
  punctuation_map_version: en-vi-v1
  # Width-variant punctuation allowlist; chỉ áp ngoài protected tokens (spec §6.6).
  punctuation_map:
    "，": ", "   # ，
    "：": ": "   # ：
    "；": "; "   # ；
    "（": " ("   # （
    "）": ") "   # ）
    "、": ", "   # 、
    "。": ". "   # 。
    "＜": "<"    # fullwidth — Noto bundle không có glyph (sự cố FONT_GLYPH_MISSING 2026-08-04)
    "＞": ">"    # fullwidth — như trên

fonts:
  pack: noto-v1
  reuse_source_font: false      # v1 skeleton: luôn map sang bundle (conservative theo §7.3)
  subset: true
  minimum_ratio: 0.85           # hard floor §8.2
  review_below_ratio: 0.95

layout:
  # Heading một dòng không vừa khung được nới ngang vào khoảng trống ĐO ĐƯỢC trên trang
  # (không có chữ/vector/ảnh nào trong dải), tối đa tới lề thân bài. Khung gốc và region_id
  # giữ nguyên; khung vẽ ghi vào `container_paint`. Tắt cờ này → hành vi engine 1.5.1.
  expand_heading: true
  # Vẽ lại gạch dẫn mục lục theo mép phải tiêu đề đã dịch (1.9.18).
  toc_leader: true
  # Neo mỗi đoạn bản dịch vào baseline đoạn nguồn để dấu bullet khớp (1.9.20).
  paragraph_anchor: true
  # Gộp CROSS-BLOCK các dòng cùng một đoạn thành một region (lg-basic-4). PDF hay đặt mỗi
  # dòng vào một block rawdict riêng nên câu bị xé theo dòng và bản dịch không đảo vế qua
  # ranh giới region được. Tắt → lg-basic-3, hành vi engine 1.6.0.
  merge_paragraph: true

render:
  pymupdf_version: "1.27.2.3"
  preserve_links: true
  mask_pad_ratio: 0.15          # pad = clamp(ratio*font_size, min, max) — PDF user units
  mask_pad_min_pt: 0.3
  mask_pad_max_pt: 1.0

qa:
  render_dpi: 300
  flagged_render_dpi: 600
  small_text_pt: 6.0            # trang có text nhỏ hơn → render 600 DPI
  diff_tile_px: 24
  diff_pixel_delta: 24          # chênh lệch kênh màu coi là khác
  diff_tile_fraction: 0.02      # tỷ lệ pixel khác để flag tile
  mask_halo_pt: 1.5
  output_size_budget_ratio: 3.0
  # Dung sai container. Ngang + mép trên giữ chặt (tràn ngang là hại thật: cắt
  # vạch cột, đè cột kế). Mép dưới nới đúng bằng phần descent mà fitter đã được
  # phép dôi ra — fit_paint và qa_gates đọc CÙNG con số này để không bất đồng.
  container_tol_pt: 1.5
  container_tol_y_em: 0.6

policy:
  require_domain_context: false # --customer-facing bật true (blocking)

translation:
  batch_max_regions: 20
  # Agent-neutral placeholder; agent truyền model id thật qua `preflight.py --provider-model`.
  provider_model_version: in-session
  prompt_version: req-v1
  # Chống pseudo-translation (sự cố 2026-08-04: agent sinh responses bằng script
  # dictionary → 76% chưa dịch). Vượt ngưỡng → P0, không waive được.
  authenticity:
    identical_ratio_max: 0.05     # tỷ lệ region đáng dịch có target trùng source
    lang_suspect_ratio_max: 0.05  # tỷ lệ region target không phải ngôn ngữ đích
    min_words: 4                  # region dưới ngưỡng từ này không xét (label/số)
